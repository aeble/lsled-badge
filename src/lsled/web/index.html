<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Badge</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #d8d8d3;
    --led-on: #ff3b1f; --led-off: #2a2a2a; --display: #111111; --accent: #1f5fd6; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #20201f; --text: #ecece8; --muted: #9a9a94; --border: #3a3a37;
            --display: #050505; --led-off: #1e1e1e; --accent: #6b9bff; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .display-wrap { background: var(--display); border-radius: 8px; padding: 12px; overflow-x: auto; margin-bottom: 8px; }
  canvas { display: block; }
  .hint { color: var(--muted); font-size: 13px; min-height: 1.4em; margin: 0 0 16px; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 15px; }
  input[type=text], select { font: inherit; padding: 7px 9px; border: 1px solid var(--border);
         border-radius: 6px; background: var(--bg); color: var(--text); }
  .text-field { grid-column: 1 / -1; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: var(--muted); }
  #status.error { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>LED Badge</h1>
  <div class="panel">
    <div class="display-wrap"><canvas id="display"></canvas></div>
    <p class="hint" id="hint"></p>
    <div class="controls">
      <label class="text-field"><span data-i18n="web.text"></span> <input type="text" id="text" value="Balrog" autocomplete="off"></label>
      <label><span data-i18n="web.driver"></span> <select id="driver"></select></label>
      <label><span data-i18n="web.device"></span> <select id="device"></select></label>
      <label><span data-i18n="web.font"></span> <select id="font"></select></label>
      <label><span data-i18n="web.mode"></span> <select id="mode"></select></label>
      <label><span data-i18n="web.brightness"></span> <select id="brightness"></select></label>
      <label><span data-i18n="web.speed"></span> <select id="speed"></select></label>
      <label class="check"><input type="checkbox" id="bold"> <span data-i18n="web.bold"></span></label>
      <label><span data-i18n="web.overflow"></span> <select id="overflow"></select></label>
    </div>
    <div class="actions">
      <button class="secondary" id="scan" data-i18n="web.scan"></button>
      <button class="secondary" id="connect" data-i18n="web.connect"></button>
      <button id="send" disabled data-i18n="web.send"></button>
      <span id="status"></span>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const PIXEL = 14;
let config, messages, language, service = null, writes = null, renderSeq = 0;
const characteristics = new Map();

const t = (key, values = {}) => messages[key].replace(/\{(\w+)\}/g, (_, name) => values[name]);
const driver = () => config.drivers[$("driver").value];

function pickLanguage(available) {
  // First browser language with a catalog; Norwegian -> nb, Simplified Chinese only
  for (const tag of navigator.languages ?? [navigator.language]) {
    const parts = tag.toLowerCase().split("-");
    let language = parts[0];
    if (language === "zh") {
      if (!parts.slice(1).some((p) => ["hant", "tw", "hk", "mo"].includes(p))) return "zh-Hans";
      continue;
    }
    if (language === "no" || language === "nn") language = "nb";
    if (available.includes(language)) return language;
  }
  return "en";
}

function draw(pages) {
  // Pages are drawn below each other, separated by one empty pixel row
  const canvas = pages.flatMap((page, i) => (i ? [new Array(page[0].length).fill(null), ...page] : page));
  const el = $("display");
  const css = getComputedStyle(document.documentElement);
  const width = canvas[0].length;
  const ratio = window.devicePixelRatio || 1;
  el.width = width * PIXEL * ratio; el.height = canvas.length * PIXEL * ratio;
  el.style.width = `${width * PIXEL}px`; el.style.height = `${canvas.length * PIXEL}px`;
  const ctx = el.getContext("2d");
  ctx.scale(ratio, ratio);
  // Rough brightness simulation; 25 % stays clearly visible
  const alpha = 0.4 + 0.6 * Number($("brightness").value) / 100;
  canvas.forEach((row, y) => row.forEach((p, x) => {
    if (p === null) return;
    ctx.globalAlpha = p ? alpha : 1;
    ctx.fillStyle = p ? css.getPropertyValue("--led-on") : css.getPropertyValue("--led-off");
    ctx.beginPath();
    ctx.arc(x * PIXEL + PIXEL / 2, y * PIXEL + PIXEL / 2, PIXEL * 0.38, 0, 2 * Math.PI);
    ctx.fill();
  }));
}

function showHint(message, isError) {
  $("hint").textContent = message;
  $("hint").style.color = isError ? "var(--error)" : "";
}

function settings() {
  return {
    text: $("text").value, font: $("font").value, bold: $("bold").checked,
    mode: $("mode").value, overflow: $("overflow").value, driver: $("driver").value,
    speed: Number($("speed").value), brightness: Number($("brightness").value), language,
  };
}

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  return response.json();
}

async function update() {
  // Rendering happens on the server; only the newest answer is shown
  const seq = ++renderSeq;
  const result = await post("render", settings());
  if (seq !== renderSeq) return;
  if (result.error) {
    writes = null;
    showHint(result.error, true);
  } else {
    writes = result.writes;
    draw(result.pages);
    const width = result.textWidth, usable = result.usableWidth;
    showHint(result.pages.length > 1
      ? t("web.paged", { count: result.pages.length, usable })
      : usable !== null
      ? t("web.used", { width, usable })
      : t(result.autoscrolled ? "web.autoscrolled" : "web.scrolling", { width }), false);
  }
  // Send through the browser connection if there is one, otherwise through the server
  $("send").disabled = !(writes && (service || $("device").value));
}

function setStatus(message, isError = false) {
  $("status").textContent = message;
  $("status").className = isError ? "error" : "";
}

async function characteristic(uuid) {
  if (!characteristics.has(uuid)) characteristics.set(uuid, await service.getCharacteristic(uuid));
  return characteristics.get(uuid);
}

function disconnect() {
  service?.device.gatt.disconnect();
  service = null;
  characteristics.clear();
}

async function connect() {
  if (!navigator.bluetooth) {
    setStatus(t("web.no_bluetooth"), true);
    return;
  }
  disconnect();
  const current = driver();
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [...current.namePrefixes.map((prefix) => ({ namePrefix: prefix })), { services: [current.serviceUuid] }],
      optionalServices: [current.serviceUuid],
    });
    device.addEventListener("gattserverdisconnected", () => {
      service = null;
      characteristics.clear();
      setStatus(t("web.disconnected"));
      update();
    });
    const server = await device.gatt.connect();
    service = await server.getPrimaryService(current.serviceUuid);
    for (const uuid of current.notifyCharacteristics) await (await characteristic(uuid)).startNotifications();
    setStatus(t("web.connected", { name: device.name }));
  } catch (error) {
    setStatus(t("web.connect_failed", { error: error.message }), true);
  }
  update();
}

async function scan() {
  $("scan").disabled = true;
  setStatus(t("web.scanning"));
  try {
    const { devices } = await (await fetch(`devices?driver=${encodeURIComponent($("driver").value)}`)).json();
    // Advertised names come from any device nearby; build options without parsing them as HTML
    $("device").replaceChildren(...devices.map((d) => new Option(`${d.name || d.address} (${d.rssi} dBm)`, d.address)));
    setStatus(devices.length ? t("web.found", { count: devices.length }) : t("msg.no_badge"));
  } catch (error) {
    setStatus(t("web.connect_failed", { error: error.message }), true);
  }
  $("scan").disabled = false;
  update();
}

async function sendViaServer() {
  setStatus(t("web.sending"));
  const result = await post("send", { ...settings(), address: $("device").value });
  if (result.error) setStatus(result.error, true);
  else setStatus(t("web.sent", { count: result.count }));
}

async function send() {
  $("send").disabled = true;
  if (!service) {
    await sendViaServer();
    update();
    return;
  }
  try {
    for (const write of writes) {
      const target = await characteristic(write.characteristic);
      const data = new Uint8Array(write.data.match(/../g).map((byte) => parseInt(byte, 16)));
      await (write.response ? target.writeValueWithResponse(data) : target.writeValueWithoutResponse(data));
      if (write.pause) await new Promise((resolve) => setTimeout(resolve, write.pause * 1000));
    }
    setStatus(t("web.sent", { count: writes.length }));
  } catch (error) {
    setStatus(t("web.send_failed", { error: error.message }), true);
  }
  update();
}

function fillSelect(id, values, selected, label = (v) => v) {
  $(id).innerHTML = values.map((v) => `<option value="${v}"${v == selected ? " selected" : ""}>${label(v)}</option>`).join("");
}

function changeDriver() {
  // Another badge type has other services; the old connection is useless
  disconnect();
  setStatus("");
  $("device").innerHTML = "";
  const previous = $("mode").value;
  const modes = driver().modes;
  fillSelect("mode", modes, modes.includes(previous) ? previous : "static", (mode) => t(`mode.${mode}`));
  update();
}

async function init() {
  config = await (await fetch("config.json")).json();
  language = pickLanguage(Object.keys(config.messages));
  messages = config.messages[language];
  document.documentElement.lang = language;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  fillSelect("driver", Object.keys(config.drivers), config.defaultDriver);
  fillSelect("font", Object.keys(config.fonts), "5x9");
  for (const option of $("font").options) option.title = config.fonts[option.value];
  fillSelect("brightness", [100, 75, 50, 25], 25, (v) => `${v} %`);
  fillSelect("speed", [1, 2, 3, 4, 5, 6, 7, 8], 5);
  fillSelect("overflow", config.overflow, "error", (choice) => t(`overflow.${choice}`));
  for (const id of ["text", "font", "mode", "brightness", "speed", "bold", "overflow"]) $(id).addEventListener("input", update);
  $("driver").addEventListener("input", changeDriver);
  // Without Web Bluetooth (Firefox, Safari) only the server path is offered
  $("connect").hidden = !navigator.bluetooth;
  $("connect").addEventListener("click", connect);
  $("scan").addEventListener("click", scan);
  $("device").addEventListener("input", update);
  $("send").addEventListener("click", send);
  changeDriver();
}

// Without config.json there are no catalogs, hence English
init().catch((error) => setStatus(`Could not load config.json: ${error.message}`, true));
</script>
</body>
</html>
